name: build and deploy

# The deploy branch is NOT `main`. `main` is kept as the EKS/ArgoCD portfolio
# branch and deploys nothing at all; this branch is what actually runs
# cuckootrade.com. Three places have to agree on the name -- this filter, the
# CI role's trust policy (var.deploy_branch in infra/variables.tf), and the
# branch checked out in /opt/cuckootrade on the instance.
#
# Only source changes build an image. Changes under deploy/ -- the Caddyfile,
# the compose file -- need no build: the instance pulls them from git on its own
# five-minute tick.
on:
  push:
    branches: [simplify_deployment]
    paths:
      - 'api/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One build at a time, so two pushes in quick succession can't race to decide
# which image :latest ends up pointing at.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 307946643562.dkr.ecr.us-east-1.amazonaws.com

permissions:
  contents: read

jobs:
  # Figures out which services actually changed so a frontend-only commit
  # doesn't rebuild and redeploy the api. Outputs a JSON array like ["api"],
  # which feeds the build matrix below.
  #
  # A manual run builds both: there's no diff to filter on, and the case that
  # needs it is a freshly built stack whose ECR repos are empty.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ github.event_name == 'workflow_dispatch' && '["api","frontend"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - 'api/**'
            frontend:
              - 'frontend/**'

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for AWS
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::307946643562:role/cuckootrade-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Two tags per build. :latest is what the instance pulls on its timer and
      # is the whole deploy mechanism -- that's why the ECR repos are MUTABLE
      # now, where the EKS stack had them IMMUTABLE. The commit-SHA tag is never
      # overwritten by anything, so it remains the exact-provenance handle and
      # the rollback target: pin IMAGE_TAG in deploy/.env on the box.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/stock-simulator-${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/stock-simulator-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations would push a second manifest under the same tag. Harmless
          # now that the repos are mutable, but they buy nothing here and the
          # manual `docker build` in the docs would have to match.
          provenance: false
          sbom: false

      - name: Where this lands
        run: |
          echo "Pushed ${{ matrix.service }} as :${GITHUB_SHA} and :latest."
          echo "The instance reconciles every 5 minutes -- nothing else to do."
          echo "To watch it land:  ssh ec2-user@<ip> 'journalctl -u cuckootrade-update -f'"
