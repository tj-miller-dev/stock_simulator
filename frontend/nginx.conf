server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs for the MPA entries.
    location = /playground {
        try_files /playground.html =404;
    }
    location = /docs {
        try_files /docs.html =404;
    }

    # Hashed assets can be cached forever; HTML must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
