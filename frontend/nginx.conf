server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs for the MPA entries.
    location = /playground {
        try_files /playground.html =404;
    }
    location = /docs {
        try_files /docs.html =404;
    }

    # Guides are extensionless too, and there are many of them, so they match
    # by prefix rather than one location per page: /guides/foo serves
    # guides/foo.html. An unknown guide falls back to the index rather than a
    # 404 -- these URLs get shared and mistyped, and a list of what does exist
    # is a better answer than a dead end.
    location = /guides {
        try_files /guides/index.html =404;
    }
    location /guides/ {
        try_files $uri $uri.html /guides/index.html;
    }

    # Hashed assets can be cached forever; HTML must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
