apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    alb.ingress.kubernetes.io/group.name: stock-simulator
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # The API only mounts /api/* -- it 404s on "/", which is the target group's
    # default health check path, so without this every api target is marked
    # unhealthy. The ALB then fails open (it routes to all targets when none are
    # healthy), which is why this stayed invisible: traffic still flowed, but
    # with no health gating at all and a 404 per check spamming the pod logs.
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    # SSE streams heartbeat every 15s; the ALB default idle timeout of 60s
    # would still kill a stalled stream mid-halt, so give it headroom. This is
    # an ALB-level attribute -- declared once here, it applies to the whole
    # shared "stock-simulator" ALB group.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    # No certificate-arn annotation -- the controller auto-discovers the ACM
    # cert by matching this rule's `host` against ISSUED certs in the account,
    # so a fresh cert ARN after every destroy/apply still just works.
spec:
  ingressClassName: alb
  rules:
    - host: cuckootrade.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    alb.ingress.kubernetes.io/group.name: stock-simulator
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: cuckootrade.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
