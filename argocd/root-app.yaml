apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stock-simulator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tj-miller-dev/stock_simulator.git
    targetRevision: cloudify
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
